<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Applies a saved light-mode choice before first paint, so
       there's no flash of the wrong theme on load. -->
  <script>
    (function () {
      if (localStorage.getItem("fpv_theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites - FPVBase</title>
  <link rel="icon" href="logo/B_.PNG" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div class="logo" onclick="window.location.href='index.html'">
      <img src="logo/FPVBaseLogo.PNG" alt="FPVBase">
    </div>

    <button type="button" id="navToggle" class="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav>
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="requests.html">Requests</a>
      <a href="upload.html">Publish</a>
      <span id="authStatus" class="auth-status"></span>
      <button type="button" id="themeToggle" class="auth-btn">Light mode</button>
    </nav>
  </header>

  <main style="padding: 40px 8%;">
    <h1>My Favorites</h1>
    <p>Find the models you've saved here.</p>

    <div class="models-grid" id="favoritesGrid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="legal.html">Legal Notice</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
      <a href="cookies.html">Cookie Policy</a>
      <a href="community-guidelines.html">Community Guidelines</a>
      <a href="moderation-policy.html">Moderation Policy</a>
      <a href="appeals.html">Appeals &amp; Takedowns</a>
    </div>
    <p class="footer-copyright">FPVBase — built for the FPV community.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="favorites.js"></script>
</body>
</html>
