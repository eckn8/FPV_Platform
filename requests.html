<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Requests - FPV Print Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo" onclick="window.location.href='index.html'">
      FPV Print Hub
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="requests.html">Requests</a>
      <a href="upload.html">Publish</a>
      <a href="favorites.html">My Favorites</a>
      <span id="authStatus" class="auth-status"></span>
    </nav>

  </header>

  <!-- CONTENT -->
  <main style="padding: 40px 8%;">

    <!-- TITLE -->
    <section class="section-title">

      <h1>FPV model requests</h1>

      <p>
        Suggest a 3D model idea to the community and vote for the most useful requests.
      </p>

    </section>

    <!-- CREATE A REQUEST -->
    <section class="upload-section">

      <h2>Create a request</h2>

      <!-- TITLE -->
      <input
        type="text"
        id="requestTitle"
        placeholder="E.g.: GPS mount for Nazgul5"
      >

      <!-- DESCRIPTION -->
      <textarea
        id="requestDescription"
        placeholder="Describe precisely what you're looking for..."
      ></textarea>

      <!-- FOLDERS -->
      <label>
        <strong>Folder / category for the request</strong>
      </label>

      <p class="upload-hint">
        Choose where this request should live.
      </p>

      <!-- BREADCRUMB -->
      <div id="requestBreadcrumb" class="breadcrumb"></div>

      <!-- FOLDERS -->
      <div id="requestFoldersGrid" class="folders-grid"></div>

      <!-- CURRENT FOLDER -->
      <p class="folder-path">
        Selected folder:
        <span id="selectedRequestPathText">None</span>
      </p>

      <!-- BUTTON -->
      <button id="createRequestButton">
        Create request
      </button>

      <!-- MESSAGE -->
      <p id="requestMessage"></p>

    </section>

    <!-- REQUEST LIST -->
    <section
      class="section-title"
      style="margin-top: 50px;"
    >

      <h2>Popular requests</h2>

      <p>
        The most voted requests appear first.
      </p>

    </section>

    <!-- GRID -->
    <div
      id="requestsGrid"
      class="models-grid"
    ></div>

  </main>

  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="requests.js"></script>

</body>
</html>
