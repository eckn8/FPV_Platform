<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Publish a model - FPVBase</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div
      class="logo"
      onclick="window.location.href='index.html'"
    >
      FPVBase
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="requests.html">Requests</a>
      <a href="upload.html">Publish</a>
      <a href="favorites.html">My Favorites</a>
      <span id="authStatus" class="auth-status"></span>
    </nav>

  </header>

  <!-- CONTENT -->
  <main style="padding: 40px 8%;">

    <!-- TITLE -->
    <section class="section-title">

      <h1>Publish an FPV model</h1>

      <p>
        Share your STL files, CNC parts or accessories with the FPV community.
      </p>

    </section>

    <!-- FORM -->
    <section class="upload-section">

      <!-- LINKED REQUEST -->
      <p
        id="linkedRequestInfo"
        class="folder-path"
      ></p>

      <!-- TITLE -->
      <label for="uploadTitle">
        <strong>Model title</strong>
      </label>

      <input
        type="text"
        id="uploadTitle"
        placeholder="E.g.: GPS O4 mount for Nazgul5"
      >

      <!-- DESCRIPTION -->
      <label for="uploadDescription">
        <strong>Description</strong>
      </label>

      <textarea
        id="uploadDescription"
        placeholder="Describe the model precisely: its purpose, constraints, etc..."
      ></textarea>

      <!-- IMAGE -->
      <label for="uploadImage">
        <strong>Model image</strong>
      </label>

      <input
        type="file"
        id="uploadImage"
        accept="image/*"
        multiple
      >

      <!-- IMAGE PREVIEW -->
      <div
       id="imagesPreview"
       class="images-preview-grid"
      ></div>

      <!-- STL -->
      <label for="uploadFile">
        <strong>STL file</strong>
      </label>

      <input
        type="file"
        id="uploadFile"
        accept=".stl"
        multiple
      >

      <div
       id="filesPreview"
       class="files-preview"
      ></div>

      <!-- FOLDERS -->
      <label>
        <strong>Folder / category</strong>
      </label>

      <p class="upload-hint">
        Choose the most fitting folder before publishing your model.
      </p>

      <!-- BREADCRUMB -->
      <div
        id="uploadBreadcrumb"
        class="breadcrumb"
      ></div>

      <!-- FOLDERS -->
      <div
       id="currentFolderContainer">
      </div>
      <div
        id="uploadFoldersGrid"
        class="folders-grid"
      ></div>

      <!-- TAGS -->
      <label for="uploadTags">
        <strong>Tags</strong>
      </label>

      <p class="upload-hint">
        Separate tags with commas:
        gps, tpu, nazgul5, dji o3...
      </p>

      <input
        type="text"
        id="uploadTags"
        placeholder="gps, tpu, nazgul5, dji o3"
      >

      <!-- FLIGHT TESTED -->
      <label for="uploadTested">
        <strong>Flight tested?</strong>
      </label>

      <select id="uploadTested">

        <option value="Not specified">
          Not specified
        </option>

        <option value="Yes">
          Yes
        </option>

        <option value="No">
          No
        </option>

      </select>

      <!-- NOTES -->
      <label for="uploadPrintNotes">
        <strong>Print notes</strong>
      </label>

      <textarea
        id="uploadPrintNotes"
        placeholder="E.g.: print in TPU, 25% infill, no supports needed..."
      ></textarea>

      <!-- BUTTON -->
      <button id="uploadButton">
        Publish model
      </button>

      <!-- MESSAGE -->
      <p id="uploadMessage"></p>

    </section>

  </main>

  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="upload.js"></script>

</body>
</html>
