# =======================================================
# ⚙️ wrangler.toml — Deployment config (Cloudflare Workers)
#
# This project is a real Worker (deployed via `wrangler deploy`,
# not `wrangler pages deploy`) — hence [assets] instead of the
# Pages Functions convention (functions/). By default, Cloudflare
# serves static files directly when they match the request, and
# only invokes worker.js for everything else (so in practice, only
# /api/upload).
# =======================================================

name = "fpv-platform"
compatibility_date = "2026-08-14"
main = "worker.js"

# ---- Custom domain -------------------------------------------
# custom_domain = true (not a plain route) so Wrangler provisions
# the DNS record + SSL certificate itself — the zone already exists
# since the domain was registered directly through Cloudflare.
routes = [
  { pattern = "fpv-base.com", custom_domain = true },
  { pattern = "www.fpv-base.com", custom_domain = true }
]

# Adding `routes` disables the workers.dev URL by default — kept on
# explicitly as a fallback/testing URL alongside the real domain.
workers_dev = true

# ---- Static site (HTML/CSS/JS at the root) ---------------
[assets]
directory = "."
binding = "ASSETS"

# ---- File storage (images/STL) -------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fpv-platform-files"

# ---- Variables used by worker.js ----------------------
# Public values (same as in supabaseClient.js / login.html) — no
# secrets here, the real protection comes from verifying the
# user's token in worker.js, not from keeping these values secret.
[vars]
SUPABASE_URL = "https://coyfyedaokkkhtmlcvaq.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_DeZEOG8W7hbVJ6KBu463QA_9w0bn-nR"
R2_PUBLIC_URL = "https://pub-0157328f7c914e80b8c23264282efe56.r2.dev"
