# =======================================================
# ⚙️ wrangler.toml — Config de déploiement (Cloudflare Workers)
#
# Ce projet est un vrai Worker (déployé via `wrangler deploy`,
# pas `wrangler pages deploy`) — d'où [assets] plutôt que la
# convention Pages Functions (functions/). Par défaut, Cloudflare
# sert les fichiers statiques directement quand ils correspondent
# à la requête, et n'invoque worker.js que pour le reste (donc
# uniquement /api/upload en pratique).
# =======================================================

name = "fpv-platform"
compatibility_date = "2026-08-14"
main = "worker.js"

# ---- Site statique (HTML/CSS/JS à la racine) ---------------
[assets]
directory = "."
binding = "ASSETS"

# ---- Stockage des fichiers (images/STL) -------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fpv-platform-files"

# ---- Variables utilisées par worker.js ----------------------
# Valeurs publiques (mêmes que dans supabaseClient.js / login.html)
# — aucun secret ici, la vraie protection vient de la vérification
# du jeton utilisateur dans worker.js, pas du secret de ces valeurs.
[vars]
SUPABASE_URL = "https://coyfyedaokkkhtmlcvaq.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_DeZEOG8W7hbVJ6KBu463QA_9w0bn-nR"
R2_PUBLIC_URL = "https://pub-0157328f7c914e80b8c23264282efe56.r2.dev"
