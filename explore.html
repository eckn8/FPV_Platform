<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explorer - FPV Print Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo" onclick="window.location.href='index.html'">
      FPV Print Hub
    </div>

    <nav>
      <a href="index.html">Accueil</a>
      <a href="explore.html">Explorer</a>
      <a href="requests.html">Demandes</a>
      <a href="upload.html">Publier</a>
      <a href="favorites.html">Mes favoris</a>
      <span id="authStatus" class="auth-status"></span>
    </nav>
  </header>

  <!-- CONTENU -->
  <main style="padding: 40px 8%;">

    <h1>Explorer les dossiers</h1>
    <p>
      Parcours les fichiers comme dans un explorateur : impression 3D, CNC, accessoires, catégories FPV...
    </p>

    <!-- Fil d’Ariane -->
    <div id="breadcrumb" class="breadcrumb"></div>

    <input
    type="text"
    id="folderSearchInput"
    placeholder="Rechercher dans ce dossier..."
    class="folder-search"
    />

    <!-- Dossiers -->
    <section>
      <h2>Dossiers</h2>
      <div id="foldersGrid" class="folders-grid"></div>
    </section>

    <!-- Modèles -->
    <section style="margin-top: 40px;">
      <h2>Modèles dans ce dossier</h2>
      <div id="modelsGrid" class="models-grid"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="explore.js"></script>
</body>
</html>
